repositories:
  frankichen/ai_war:
    enabled: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - repo-fast-check
      - python-check
    max_timeout_seconds: 900

  frankichen/lenshub-diag-mcp:
    enabled: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - python-check
    max_timeout_seconds: 900

  frankichen/sxt:
    enabled: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - repo-fast-check
      - go-check
      - node-check
    max_timeout_seconds: 900
    workspaces:
      - path: .
        type: auto
      - path: h5/lenshub-console
        type: node
        package_manager: npm
        required_scripts:
          - test:run
          - typecheck
          - build
        optional_scripts:
          - lint

  frankichen/github_mcp:
    enabled: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - repo-fast-check
      - python-check
    max_timeout_seconds: 900

  frankichen/auto_gupiao:
    enabled: true
    private_ci: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - go-check
    max_timeout_seconds: 900
    deployment:
      enabled: true
      environment: auto-gupiao-test
      scope: reports
      private_ci: false
      script: scripts/deploy_auto_gupiao.sh
      workspace_env: AUTO_GUPIAO_DEPLOY_WORKSPACE
      status_file_env: AUTO_GUPIAO_DEPLOY_STATUS_FILE
