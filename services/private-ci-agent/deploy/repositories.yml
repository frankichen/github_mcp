repositories:
  frankichen/ai_war:
    enabled: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - repo-fast-check
      - python-check
    max_timeout_seconds: 900

  frankichen/lenshub-diag-mcp:
    enabled: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - python-check
    max_timeout_seconds: 900

  frankichen/sxt:
    enabled: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - repo-fast-check
      - go-check
      - node-check
      - openapi-check
    max_timeout_seconds: 900
    workspaces:
      - path: .
        type: auto
        services:
          - postgres-global
          - postgres-regional-cn
          - postgres-regional-de
          - redis
          - rabbitmq
        hooks:
          - go-migrate
          - ai-integrity
      - path: h5/lenshub-console
        type: node
        package_manager: npm
        required_scripts:
          - test:run
          - typecheck
          - build
        optional_scripts:
          - lint
      - path: h5/lenshub-console-react
        type: node
        package_manager: npm
        required_scripts:
          - test:run
          - typecheck
          - build

  frankichen/github_mcp:
    enabled: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - repo-fast-check
      - python-check
    max_timeout_seconds: 900

  # XYZL owns these parent build contexts.  Nested projects are deliberately
  # not workspace roots: app owns the .NET solution and the Android
  # multi-project Gradle build; AiService is its own Gradle root.
  frankichen/xyzl:
    enabled: true
    private_ci: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - repo-fast-check
      - dotnet-check
      - gradle-check
      - maven-check
      - node-check
    max_timeout_seconds: 900
    workspaces:
      - path: app
        type: auto
      - path: app/AiService
        type: gradle
      - path: bed-admin-backend
        type: maven
      - path: bed-admin-frontend
        type: node
        package_manager: npm
      - path: isup-server
        type: maven

  frankichen/auto_gupiao:
    enabled: true
    private_ci: true
    auto_detect: true
    allowed_profiles:
      - repo-auto-check
      - go-check
    max_timeout_seconds: 900
    deployment:
      enabled: true
      environment: auto-gupiao-test
      scope: reports
      private_ci: false
      script: scripts/deploy_auto_gupiao.sh
      workspace_env: AUTO_GUPIAO_DEPLOY_WORKSPACE
      status_file_env: AUTO_GUPIAO_DEPLOY_STATUS_FILE
