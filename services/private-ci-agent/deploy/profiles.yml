profiles:
  repo-fast-check:
    description: "Conservative changed-file fast feedback; never merge eligible"
    execution_mode: bounded_parallel
    merge_eligible: false

  repo-auto-check:
    description: "Scan controlled Manifest workspaces and orchestrate approved checks"
    execution_mode: sequential

  openapi-check:
    description: "Run the repository-owned OpenAPI validator with a fixed Node 22 runtime"
    execution_mode: sequential
    merge_eligible: false
    language: node
    base_image: docker.io/library/node:22
    command: "OPENAPI_PARALLELISM=1 bash scripts/validate-openapi.sh"

  go-check:
    description: "Go version-aware format, vet, test, build"
    language: go
    base_image: derived-from-go.mod
    toolchain_policy: "select at least the go.mod go/toolchain directive"
    checks:
      - gofmt
      - govet
      - gotest
      - gobuild

  python-check:
    description: "Python lint, compile, test"
    language: python
    base_image: docker.io/library/python:3.12-slim

  node-check:
    description: "Node.js workspace checks from package.json scripts"
    language: node
    base_image: docker.io/library/node:22
    package_managers:
      package-lock.json: npm
      pnpm-lock.yaml: pnpm
      yarn.lock: yarn
      bun.lock: bun
    allowed_scripts:
      - lint
      - typecheck
      - test:run
      - test:ci
      - test
      - build

  rust-check:
    description: "Rust format, offline check, and test after controlled dependency fetch"
    language: rust
    base_image: docker.io/library/rust:1.97.1-bookworm
    cache: cargo

  maven-check:
    description: "Maven dependency prefetch and offline test"
    language: maven
    base_image: docker.io/library/maven:3.9.16-eclipse-temurin-21
    cache: maven

  gradle-check:
    description: "Gradle dependency preparation and offline test"
    language: gradle
    base_image: docker.io/library/gradle:9.7.0-jdk21-jammy
    cache: gradle

  dotnet-check:
    description: ".NET restore, build, and test with pinned .NET 8 LTS SDK"
    language: dotnet
    base_image: mcr.microsoft.com/dotnet/sdk:8.0.424-bookworm-slim
    cache: nuget
