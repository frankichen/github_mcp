services:
  gateway:
    image: ${LENSHUB_GATEWAY_IMAGE:-lenshub-test-gateway:${LENSHUB_IMAGE_TAG:-latest}}
    restart: unless-stopped
    ports:
      - "${LENSHUB_HTTP_PORT:-80}:80"
      - "${LENSHUB_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - lenshub
    volumes:
      - type: bind
        source: ../nginx/lenshub-gateway.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: /home/dly/nginx/.htpasswd
        target: /etc/nginx/.htpasswd
        read_only: true
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
        read_only: true
      - type: bind
        source: /home/dly/letsencrypt-www
        target: /var/www/certbot
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
