server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /h5 {
        return 301 /h5/;
    }

    location ^~ /h5/ {
        try_files $uri $uri/ /h5/index.html;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = /newadmin {
        return 301 /newadmin/;
    }

    location ^~ /newadmin/ {
        try_files $uri $uri/ /newadmin/index.html;
    }

    location = /tester {
        return 301 /tester/;
    }

    location ^~ /tester/ {
        try_files $uri $uri/ /tester/index.html;
    }

    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    location = /openapi {
        return 301 /openapi/;
    }

    location ^~ /openapi/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
