server {
    listen 80;
    listen [::]:80;
    server_name server.winpozo.com _;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://server.winpozo.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name server.winpozo.com;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $lenshub_api http://api:8080;

    ssl_certificate /etc/letsencrypt/live/server.winpozo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.winpozo.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LensHubSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = / {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }

    location = /app {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 301 /app/;
    }

    location ^~ /app/ {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /app/index.html;
    }

    location = /h5 {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 301 /h5/;
    }

    location ^~ /h5/ {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /h5/index.html;
    }

    location = /newadmin {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 301 /newadmin/;
    }

    location ^~ /newadmin/ {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /newadmin/index.html;
    }

    location = /tester {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 301 /tester/;
    }

    location ^~ /tester/ {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /tester/index.html;
    }

    location = /docs {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 301 /docs/;
    }

    location ^~ /docs/ {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /docs/index.html;
    }

    location = /openapi {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 301 /openapi/;
    }

    location ^~ /openapi/ {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
    }

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /public/v1/ {
        proxy_pass $lenshub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /admin/v1/ {
        proxy_pass $lenshub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/v1/ {
        proxy_pass $lenshub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /device/v1/ {
        proxy_pass $lenshub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /callback/v1/ {
        proxy_pass $lenshub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 301 /admin/;
    }

    location ^~ /admin/ {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        auth_basic "LensHub Test";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
    }
}
