exclude_paths:
  - vendor/**
  - node_modules/**
  - dist/**
  - build/**
  - "*.min.js"
  - "*.min.css"
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - poetry.lock
  - "*.pyc"
  - __pycache__/**

exclude_commit_subject_patterns:
  - "^Merge "
  - "^chore\\(deps\\):"
  - "^Bump "
  - "^dependabot"

exclude_authors:
  - github-actions[bot]
  - dependabot[bot]
  - copilot[bot]
