services:
  github-action-service:
    build:
      context: .
      args:
        SOURCE_REPOSITORY: ${SOURCE_REPOSITORY:-https://github.com/frankichen/github_mcp}
        VCS_REF: ${VCS_REF:?VCS_REF is required for a production Controller build}
        SERVICE_VERSION: ${SERVICE_VERSION:-12.0.2}
        BUILD_DATE: ${BUILD_DATE:?BUILD_DATE is required for a production Controller build}
    container_name: github-action-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEPLOYMENT_DB_PATH: /data/private-ci/deployments.db
      DEPLOY_STATUS_FILE: /data/private-ci/gongshi-test-status.json
      DEPLOY_CALLBACK_API_KEY_FILE: /run/secrets/deploy_callback_api_key
      MYGITHUB12_RUNTIME_MODE: production
      MYGITHUB12_BUILD_SHA: ${MYGITHUB12_BUILD_SHA:?MYGITHUB12_BUILD_SHA is required for a production Controller}
      MYGITHUB12_VERSION: ${MYGITHUB12_VERSION:-12.0.2}
      MYGITHUB10_RUNTIME_MODE: production
      MYGITHUB10_BUILD_SHA: ${MYGITHUB10_BUILD_SHA:?MYGITHUB10_BUILD_SHA is required for a production Controller}
      MYGITHUB10_VERSION: ${MYGITHUB10_VERSION:-12.0.2}
    ports:
      - "127.0.0.1:8765:8000"
      - "100.127.108.20:8765:8000"
    volumes:
      - github_action_data:/data
      # Mount the directory, not only the SQLite main file. SQLite WAL/SHM
      # sidecars must be visible to both the Controller and deploy agent.
      - /var/lib/private-ci:/data/private-ci
      - /opt/github-action-service/secrets/github_classic_pat:/run/secrets/github_classic_pat:ro
      - /opt/github-action-service/secrets/deploy_callback_api_key:/run/secrets/deploy_callback_api_key:ro

volumes:
  github_action_data:
