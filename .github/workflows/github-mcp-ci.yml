name: GitHub MCP CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_DB_PATH: ${{ runner.temp }}/ci.db
      DEPLOYMENT_DB_PATH: ${{ runner.temp }}/deployments.db
      DEPLOY_STATUS_FILE: ${{ runner.temp }}/gongshi-test-status.json
      AUTO_GUPIAO_DEPLOY_STATUS_FILE: ${{ runner.temp }}/auto-gupiao-status.json
      IDEMPOTENCY_DB_PATH: ${{ runner.temp }}/idempotency.db
    defaults:
      run:
        working-directory: services/github-action-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/github-action-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
